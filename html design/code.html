<script>
        let stepCount = 1;

        function addStep() {
            stepCount++;
            const container = document.getElementById('steps-container');
            const stepHtml = `
                <div class="step-item flex gap-md items-start p-sm border border-outline-variant rounded-lg bg-white relative group animate-in fade-in slide-in-from-top-2 duration-300">
                    <div class="flex-shrink-0 w-8 h-8 rounded-full bg-primary text-on-primary flex items-center justify-center font-bold text-title-md">${stepCount}</div>
                    <div class="flex-1">
                        <textarea placeholder="Describe the action to take in this step..." 
                                  class="w-full px-sm py-xs rounded-lg border-none bg-surface focus:bg-white focus:ring-1 focus:ring-primary transition-all outline-none resize-none" rows="2"></textarea>
                    </div>
                    <button type="button" onclick="removeStep(this)" class="material-symbols-outlined text-outline-variant hover:text-error opacity-0 group-hover:opacity-100 transition-opacity p-1">delete</button>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', stepHtml);
            updateStepNumbers();
        }

        function removeStep(button) {
            const item = button.closest('.step-item');
            item.classList.add('animate-out', 'fade-out', 'slide-out-to-top-2');
            setTimeout(() => {
                item.remove();
                updateStepNumbers();
            }, 200);
        }

        function updateStepNumbers() {
            const steps = document.querySelectorAll('.step-item');
            stepCount = steps.length;
            steps.forEach((step, index) => {
                const numberCircle = step.querySelector('div:first-child');
                numberCircle.textContent = index + 1;
            });
        }

        // Mock form submission
        document.getElementById('article-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Saving...';
            
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Saved Successfully';
                btn.classList.replace('bg-[#A72429]', 'bg-green-600');
                
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = originalText;
                    btn.classList.replace('bg-green-600', 'bg-[#A72429]');
                }, 2000);
            }, 1000);
        });
    </script>
