<!-- Background Decoration (Optional) -->
<div class="fixed inset-0 overflow-hidden -z-10 opacity-40">

</div>
<!-- Main Container -->
<main class="w-full max-w-md">
<!-- Logo Section -->
<div class="flex flex-col items-center mb-lg">
<div class="mb-sm">
<!-- Using a styled representation for the Oracle Logo -->
<div class="flex items-center gap-xs">
<span class="font-display-lg text-display-lg text-primary tracking-tighter uppercase">Oracle</span>
<span class="font-title-lg text-title-lg text-secondary pt-base">CRM</span>
</div>
</div>
<p class="font-body-md text-body-md text-secondary">Knowledge Management System</p>
</div>
<!-- Login Card -->
<div class="login-card bg-surface-container-lowest border border-outline-variant rounded-2xl p-lg">
<h1 class="font-headline-md text-headline-md text-on-surface mb-xl text-center">Sign In</h1>
<form class="space-y-md" id="loginForm">
<!-- Role Selection -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-secondary uppercase tracking-wider block">Access Role</label>
<div class="flex gap-sm">
<button class="role-chip flex-1 py-xs border border-outline rounded-lg font-title-md text-title-md text-on-surface hover:bg-surface-variant" id="role-admin" onclick="selectRole('admin')" type="button">
                            Admin
                        </button>
<button class="role-chip active flex-1 py-xs border border-outline rounded-lg font-title-md text-title-md text-on-surface hover:bg-surface-variant" id="role-user" onclick="selectRole('user')" type="button">
                            User
                        </button>
</div>
</div>
<!-- Identity Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-secondary uppercase tracking-wider block" for="identity">Employee ID / Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-secondary">person</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all font-body-md text-body-md" id="identity" name="identity" placeholder="e.g. 100452 or user@oracle.com" required="" type="text">
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-secondary uppercase tracking-wider" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-secondary">lock</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Action Button -->
<div class="pt-sm">
<button class="btn-primary w-full py-sm rounded-lg text-white font-title-md text-title-md shadow-lg flex items-center justify-center gap-xs" type="submit">
                        Enter Workspace
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-xl pt-md border-t border-outline-variant text-center">
<p class="font-body-md text-body-md text-secondary">
                    Need technical assistance? 
                    <a class="text-primary font-semibold hover:underline" href="#">Contact Support</a>
</p>
</div>
</div>
<!-- Footer Info -->
<footer class="mt-xl text-center space-y-xs opacity-60">
<p class="font-label-md text-label-md text-on-surface-variant">© 2024 Oracle CRM Knowledge Base. Internal Use Only.</p>
<div class="flex justify-center gap-md">
<a class="font-label-md text-label-md text-secondary hover:text-primary underline" href="#">Privacy Policy</a>
<a class="font-label-md text-label-md text-secondary hover:text-primary underline" href="#">Security</a>
</div>
</footer>
</main>
<script>
        let currentRole = 'user';

        function selectRole(role) {
            currentRole = role;
            const adminBtn = document.getElementById('role-admin');
            const userBtn = document.getElementById('role-user');
            
            if (role === 'admin') {
                adminBtn.classList.add('active');
                userBtn.classList.remove('active');
            } else {
                userBtn.classList.add('active');
                adminBtn.classList.remove('active');
            }
            
            // Subtle visual feedback
            console.log("Selected access level: " + role);
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            // Loading state simulation
            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span> Authenticating...';
            
            setTimeout(() => {
                alert(`Authenticated as ${currentRole.toUpperCase()}. Redirecting to workspace...`);
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 1200);
        });
    </script>
</body></html>
